name: Build Win32 app

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Compile Win32 application
        shell: cmd
        run: >-
          cl /nologo /EHsc /std:c++17 /DUNICODE /D_UNICODE /utf-8 /W4 /O2
          command_palette_win32.cpp
          /link /SUBSYSTEM:WINDOWS user32.lib gdi32.lib
          /OUT:command_palette_win32.exe

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: command-palette-win32
          path: command_palette_win32.exe
          if-no-files-found: error
