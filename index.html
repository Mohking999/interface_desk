<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Command Palette</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect } = React;

      function SearchIcon(props) {
        return (
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" {...props}>
            <circle cx="11" cy="11" r="6" />
            <path d="M16 16L21 21" />
          </svg>
        );
      }

      function FolderIcon(props) {
        return (
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" {...props}>
            <path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h4l1.8 2.2H18.5A2.5 2.5 0 0 1 21 9.7v7.8A2.5 2.5 0 0 1 18.5 20h-13A2.5 2.5 0 0 1 3 17.5z" />
          </svg>
        );
      }

      function FileEditIcon(props) {
        return (
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" {...props}>
            <path d="M14 3h5v5" />
            <path d="M14 3l7 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9z" />
            <path d="M12 18l6-6" />
            <path d="M8 17h4" />
          </svg>
        );
      }

      function MoonIcon(props) {
        return (
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" {...props}>
            <path d="M21 12.8A9 9 0 0 1 11.2 3a9 9 0 1 0 9.8 9.8z" />
          </svg>
        );
      }

      function FileTextIcon(props) {
        return (
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" {...props}>
            <path d="M14 3h5v5" />
            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9l5 5v11a2 2 0 0 1-2 2z" />
            <path d="M8 11h8M8 15h8" />
          </svg>
        );
      }

      function FigmaIcon(props) {
        return (
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round" {...props}>
            <circle cx="12" cy="12" r="9" />
            <path d="M9 5.5a2.5 2.5 0 0 1 2.5 2.5V9H9A2.5 2.5 0 0 1 9 5.5zM9 9h2.5v2.5H9A2.5 2.5 0 0 1 9 9zm0 4.5h2.5V16A2.5 2.5 0 0 1 9 16v-2.5zM14.5 5.5A2.5 2.5 0 0 1 17 8a2.5 2.5 0 0 1-2.5 2.5H12V8a2.5 2.5 0 0 1 2.5-2.5zm0 7A2.5 2.5 0 0 1 17 15.5A2.5 2.5 0 0 1 14.5 18H12v-5h2.5z" />
          </svg>
        );
      }

      function TerminalIcon(props) {
        return (
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" {...props}>
            <rect x="3" y="4" width="18" height="16" rx="2" />
            <path d="M8 9l3 3-3 3M13 15h5" />
          </svg>
        );
      }

      function PanelRightIcon(props) {
        return (
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" {...props}>
            <rect x="3" y="4" width="18" height="16" rx="2" />
            <path d="M15 4v16M9 10l-3 2 3 2" />
          </svg>
        );
      }

      function ArrowUpIcon(props) {
        return (
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" {...props}>
            <path d="M12 19V5" />
            <path d="M5 12l7-7 7 7" />
          </svg>
        );
      }

      function ArrowDownIcon(props) {
        return (
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" {...props}>
            <path d="M12 5v14" />
            <path d="M19 12l-7 7-7-7" />
          </svg>
        );
      }

      function CornerDownLeftIcon(props) {
        return (
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" {...props}>
            <path d="M9 9l-5 5 5 5" />
            <path d="M20 5v6a4 4 0 0 1-4 4H4" />
          </svg>
        );
      }

      const ITEMS = [
        {
          id: 'open-downloads',
          section: 'Suggested',
          title: 'Open Downloads',
          subtitle: 'Jump to your downloaded files',
          category: 'Commands',
          rightLabel: '↵',
          isShortcutBadge: true,
          icon: FolderIcon,
          preview: {
            title: 'Downloads',
            path: '/Users/you/Downloads',
            kind: 'Folder',
            contents: '24 items',
            lastOpened: 'Today, 10:42',
            primaryAction: 'Open in Finder',
          },
        },
        {
          id: 'quick-note',
          section: 'Suggested',
          title: 'Create a quick note',
          subtitle: 'Capture a thought in a new document',
          category: 'Commands',
          rightLabel: '⌘ N',
          icon: FileEditIcon,
          preview: {
            title: 'Quick Note',
            path: '/Users/you/Documents/Notes',
            kind: 'Command',
            contents: 'Markdown Template',
            lastOpened: 'Today, 09:15',
            primaryAction: 'Create Note',
          },
        },
        {
          id: 'toggle-dnd',
          section: 'Suggested',
          title: 'Toggle Do Not Disturb',
          subtitle: 'Silence notifications and stay focused',
          category: 'Commands',
          rightLabel: 'System',
          icon: MoonIcon,
          preview: {
            title: 'Do Not Disturb',
            path: 'System Settings / Focus',
            kind: 'System Toggle',
            contents: 'Status: Off',
            lastOpened: 'Yesterday, 22:00',
            primaryAction: 'Toggle Focus',
          },
        },
        {
          id: 'weekly-review',
          section: 'Recent',
          title: 'Weekly review.md',
          subtitle: 'Documents / Notes',
          category: 'Files',
          rightLabel: '12m ago',
          icon: FileTextIcon,
          preview: {
            title: 'Weekly review.md',
            path: '/Users/you/Documents/Notes/Weekly review.md',
            kind: 'Markdown Document',
            contents: '4.2 KB',
            lastOpened: '12m ago',
            primaryAction: 'Open Document',
          },
        },
        {
          id: 'interface-exploration',
          section: 'Recent',
          title: 'Interface exploration.fig',
          subtitle: 'Documents / Design',
          category: 'Files',
          rightLabel: '38m ago',
          icon: FigmaIcon,
          preview: {
            title: 'Interface exploration.fig',
            path: '/Users/you/Documents/Design/Interface exploration.fig',
            kind: 'Figma Design File',
            contents: '18.7 MB',
            lastOpened: '38m ago',
            primaryAction: 'Open in Figma',
          },
        },
        {
          id: 'terminal',
          section: 'Recent',
          title: 'Terminal',
          subtitle: 'Applications / Utilities',
          category: 'Applications',
          rightLabel: '1h ago',
          icon: TerminalIcon,
          preview: {
            title: 'Terminal.app',
            path: '/System/Applications/Utilities/Terminal.app',
            kind: 'Application',
            contents: 'Version 2.14',
            lastOpened: '1h ago',
            primaryAction: 'Launch Application',
          },
        },
      ];

      const TABS = ['All', 'Applications', 'Files', 'Commands'];

      function CommandPalette() {
        const [search, setSearch] = useState('');
        const [activeTab, setActiveTab] = useState('All');
        const [selectedId, setSelectedId] = useState('open-downloads');
        const [showPreview, setShowPreview] = useState(true);

        const filteredItems = ITEMS.filter((item) => {
          const matchesTab = activeTab === 'All' || item.category === activeTab;
          const matchesSearch =
            item.title.toLowerCase().includes(search.toLowerCase()) ||
            item.subtitle.toLowerCase().includes(search.toLowerCase());
          return matchesTab && matchesSearch;
        });

        const selectedItem =
          filteredItems.find((item) => item.id === selectedId) || filteredItems[0] || ITEMS[0];

        useEffect(() => {
          const handleKeyDown = (event) => {
            if (event.key === 'ArrowDown') {
              event.preventDefault();
              const currentIndex = filteredItems.findIndex((item) => item.id === selectedItem?.id);
              const nextIndex = (currentIndex + 1) % filteredItems.length;
              if (filteredItems[nextIndex]) setSelectedId(filteredItems[nextIndex].id);
            } else if (event.key === 'ArrowUp') {
              event.preventDefault();
              const currentIndex = filteredItems.findIndex((item) => item.id === selectedItem?.id);
              const prevIndex = (currentIndex - 1 + filteredItems.length) % filteredItems.length;
              if (filteredItems[prevIndex]) setSelectedId(filteredItems[prevIndex].id);
            } else if (event.key === 'Tab') {
              event.preventDefault();
              const currentTabIndex = TABS.indexOf(activeTab);
              const nextTabIndex = (currentTabIndex + 1) % TABS.length;
              setActiveTab(TABS[nextTabIndex]);
            } else if (event.key === 'Escape') {
              setSearch('');
            }
          };

          window.addEventListener('keydown', handleKeyDown);
          return () => window.removeEventListener('keydown', handleKeyDown);
        }, [filteredItems, selectedItem, activeTab]);

        const suggestedItems = filteredItems.filter((item) => item.section === 'Suggested');
        const recentItems = filteredItems.filter((item) => item.section === 'Recent');

        return (
          <div className="app-shell">
            <div className="command-palette">
              <header className="topbar">
                <div className="search-row">
                  <SearchIcon className="search-icon" />
                  <input
                    type="text"
                    value={search}
                    onChange={(event) => setSearch(event.target.value)}
                    placeholder="Search apps, files, and commands..."
                    autoFocus
                  />
                  <kbd className="keycap">esc</kbd>
                </div>
              </header>

              <div className="tabs-row">
                <div className="tabs">
                  {TABS.map((tab) => (
                    <button
                      key={tab}
                      className={tab === activeTab ? 'tab active' : 'tab'}
                      onClick={() => setActiveTab(tab)}
                    >
                      {tab}
                    </button>
                  ))}
                </div>
                <div className="switch-indicator">
                  <span>Switch</span>
                  <kbd className="mini-key">⇥</kbd>
                </div>
              </div>

              <div className="content-grid">
                <div className={showPreview ? 'results-column has-preview' : 'results-column full'}>
                  <div className="result-section">
                    {suggestedItems.length > 0 && (
                      <div>
                        <div className="section-label-row">
                          <span>Suggested</span>
                          <span className="section-tag">Commands</span>
                        </div>
                        <div className="result-list">
                          {suggestedItems.map((item) => {
                            const Icon = item.icon;
                            const isSelected = selectedItem?.id === item.id;
                            return (
                              <button
                                key={item.id}
                                className={isSelected ? 'result-item selected' : 'result-item'}
                                onClick={() => setSelectedId(item.id)}
                              >
                                <div className="left-side">
                                  <Icon className={isSelected ? 'result-icon selected' : 'result-icon'} />
                                  <div className="title-wrap">
                                    <div className={isSelected ? 'result-title selected' : 'result-title'}>{item.title}</div>
                                    <div className={isSelected ? 'result-subtitle selected' : 'result-subtitle'}>{item.subtitle}</div>
                                  </div>
                                </div>
                                {item.isShortcutBadge ? (
                                  <kbd className={isSelected ? 'badge key selected' : 'badge key'}>{item.rightLabel}</kbd>
                                ) : (
                                  <span className={isSelected ? 'badge text selected' : 'badge text'}>{item.rightLabel}</span>
                                )}
                              </button>
                            );
                          })}
                        </div>
                      </div>
                    )}
                  </div>

                  <div className="result-section">
                    {recentItems.length > 0 && (
                      <div>
                        <div className="section-label-row">
                          <span>Recent</span>
                          <span className="section-tag">Last Opened</span>
                        </div>
                        <div className="result-list">
                          {recentItems.map((item) => {
                            const Icon = item.icon;
                            const isSelected = selectedItem?.id === item.id;
                            return (
                              <button
                                key={item.id}
                                className={isSelected ? 'result-item selected' : 'result-item'}
                                onClick={() => setSelectedId(item.id)}
                              >
                                <div className="left-side">
                                  <Icon className={isSelected ? 'result-icon selected' : 'result-icon'} />
                                  <div className="title-wrap">
                                    <div className={isSelected ? 'result-title selected' : 'result-title'}>{item.title}</div>
                                    <div className={isSelected ? 'result-subtitle selected' : 'result-subtitle'}>{item.subtitle}</div>
                                  </div>
                                </div>
                                <span className={isSelected ? 'badge text selected' : 'badge text'}>{item.rightLabel}</span>
                              </button>
                            );
                          })}
                        </div>
                      </div>
                    )}
                  </div>
                </div>

                {showPreview && selectedItem && (
                  <aside className="preview-panel">
                    <div className="preview-header">
                      <span>Preview</span>
                      <button onClick={() => setShowPreview(false)} className="preview-toggle" aria-label="Hide preview">
                        <PanelRightIcon className="mini-panel-icon" />
                      </button>
                    </div>

                    <div className="preview-icon-box">
                      {React.createElement(selectedItem.icon, { className: 'preview-icon' })}
                    </div>

                    <h2>{selectedItem.preview.title}</h2>
                    <p>{selectedItem.preview.path}</p>

                    <div className="meta-list">
                      <div className="meta-row">
                        <span>Kind</span>
                        <span>{selectedItem.preview.kind}</span>
                      </div>
                      <div className="meta-row">
                        <span>Contents</span>
                        <span>{selectedItem.preview.contents}</span>
                      </div>
                      <div className="meta-row">
                        <span>Last opened</span>
                        <span>{selectedItem.preview.lastOpened}</span>
                      </div>
                    </div>

                    <div className="preview-actions">
                      <button className="primary-action">
                        <span>{selectedItem.preview.primaryAction}</span>
                        <CornerDownLeftIcon className="action-arrow" />
                      </button>
                      <button className="secondary-action">
                        <span>Copy path</span>
                        <span className="shortcut-cluster">⌘ ⇧ C</span>
                      </button>
                    </div>
                  </aside>
                )}
              </div>

              <footer className="footer-bar">
                <div className="footer-group left">
                  <div className="footer-split">
                    <kbd className="footer-key"><ArrowUpIcon className="footer-icon" /></kbd>
                    <kbd className="footer-key"><ArrowDownIcon className="footer-icon" /></kbd>
                    <span>Navigate</span>
                  </div>
                  <div className="footer-split">
                    <kbd className="footer-key">↵</kbd>
                    <span>Open</span>
                  </div>
                </div>

                <div className="footer-group right">
                  <span>Actions</span>
                  <kbd className="footer-key small">⌘</kbd>
                  <kbd className="footer-key small">↵</kbd>
                </div>
              </footer>
            </div>

            <div className="bottom-caption">
              <div className="caption-left">
                <span>A little less clicking —</span>
                <kbd className="caption-key">⌘ K</kbd>
                <span>from anywhere.</span>
              </div>
              <span>Personal workspace</span>
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<CommandPalette />);
    </script>
  </body>
</html>
